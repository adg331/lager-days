<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F3E6"/>
      <stop offset="1" stop-color="#EADFC8"/>
    </linearGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8C04A"/>
      <stop offset="0.55" stop-color="#F0A12E"/>
      <stop offset="1" stop-color="#D97A1C"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8A6A3A" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8A6A3A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="glass"><path d="M330 300 L694 300 L656 800 Q654 826 628 826 L396 826 Q370 826 368 800 Z"/></clipPath>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#9C7A45" flood-opacity="0.22"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(512 530) scale(1.2) translate(-512 -530)">
  <ellipse cx="512" cy="836" rx="230" ry="34" fill="url(#shadow)"/>
  <!-- liquid -->
  <g clip-path="url(#glass)">
    <rect x="300" y="300" width="424" height="540" fill="url(#beer)"/>
    <rect x="380" y="300" width="70" height="540" fill="url(#sheen)"/>
    <circle cx="624" cy="452" r="11" fill="#FFF6DC" opacity="0.85"/>
    <circle cx="612" cy="512" r="8" fill="#FFF6DC" opacity="0.75"/>
    <circle cx="622" cy="562" r="6" fill="#FFF6DC" opacity="0.65"/>
    <!-- foam band inside glass -->
    <rect x="300" y="300" width="424" height="118" fill="#FFFDF7"/>
    <rect x="300" y="404" width="424" height="14" fill="#F3E6C8"/>
  </g>
  <!-- foam crown spilling over rim -->
  <path filter="url(#soft)" d="M318 312 C318 250 380 236 420 252 C440 206 520 196 552 236 C590 206 660 222 668 268 C700 268 712 296 706 318 Z" fill="#FFFDF7"/>
  <!-- glass rim & walls -->
  <path d="M330 300 L694 300 L656 800 Q654 826 628 826 L396 826 Q370 826 368 800 Z" fill="none" stroke="#D9C8A6" stroke-width="18" stroke-linejoin="round" opacity="0.55"/>
  <path d="M330 300 L694 300 L656 800 Q654 826 628 826 L396 826 Q370 826 368 800 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="10" stroke-linejoin="round"/>
  <path d="M372 806 Q374 822 396 822 L628 822 Q650 822 652 806 L654 780 L370 780 Z" fill="#fff" opacity="0.35"/>
  <!-- seal -->
  <g transform="translate(512 600)">
    <rect x="-72" y="-72" width="144" height="144" rx="26" fill="#A34C3A"/>
    <text x="0" y="44" text-anchor="middle" font-family="Hiragino Mincho ProN, Songti SC, serif" font-weight="600" font-size="120" fill="#FFF8EA">麦</text>
  </g>
</g>
</svg>
